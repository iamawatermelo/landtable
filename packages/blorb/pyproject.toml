[project]
name = "blorb"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]
dynamic = ["version"]
python-packages = ["blorb"]

[project.optional-dependencies]
benchmark = [
    "landtable_legacy @ git+https://github.com/iamawatermelo/landtable@df2f964221b1cbe6690ab54a464193e343603c99",
]

[build-system]
requires = ["maturin>=1.8,<2.0"]
build-backend = "maturin"

[[tool.uv.cache-keys]]
file = "src/**/*.rs"

[[tool.uv.cache-keys]]
file = "*.toml"

[tool.maturin]
module-name = "blorb._blorb"
features = ["pyo3/extension-module"]